# The permanent test rig: `pnpm test` on the project's PostgreSQL 16 cluster.
#
# The storage, API, HTTP, auth, e-Factura, documents and ops tests all talk to a
# real server, so `node --test` means nothing on the host alone. No PostgreSQL of
# its own: the suite reaches the project's `db` (compose.yaml) over its network
# and works only in throwaway databases named `qwbe_t_<run>_…`, created from
# `postgres` and dropped again; `qwbe_invoicing` is never used. No port is
# published, no application volume is referenced and `down` is never given `-v`.
# The dependency volumes are the verifier's, read-write because `install`
# populates them.
#
# Run:   scripts/verify-docker.sh test
#        scripts/verify-docker.sh test "node --test kernel/storage/pagination.test.ts"
# Down:  scripts/verify-docker.sh down    (stops this rig, never the project's db)
name: qwbe-invoicing-test

x-test-image: &test-image
  image: qwbe-invoicing-verify:${VERIFY_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.verify
    args:
      HOST_UID: ${HOST_UID:?run through scripts/verify-docker.sh}
      HOST_GID: ${HOST_GID:?run through scripts/verify-docker.sh}

x-test-volumes: &test-volumes
  - .:/app
  - verify-node-modules:/app/node_modules
  - verify-frontend-node-modules:/app/frontend/node_modules
  - verify-pnpm-store:/pnpm-store
  - verify-home:/home/verifier

services:
  # Ownership of the fresh named volumes. Idempotent: it may run before every invocation.
  test-init:
    <<: *test-image
    user: "0:0"
    command:
      - |
        set -eu
        chown ${HOST_UID}:${HOST_GID} /app/node_modules /app/frontend/node_modules /pnpm-store /pnpm-store/store /home/verifier
    volumes: *test-volumes
    restart: "no"

  test:
    <<: *test-image
    user: "${HOST_UID}:${HOST_GID}"
    # The run id the script reclaims by (scripts/verify-docker.sh).
    labels:
      qwbe.test-run: ${QWBE_TEST_RUN:?run through scripts/verify-docker.sh}
    environment:
      # No PUBLIC_ORIGIN, as in compose.verify.yaml: the fixtures pin their own
      # ephemeral loopback address, and a CLI child inherits this environment.
      # Scratch only: tmpfs below, nothing in it survives the container. No
      # DATA_DIR here on purpose: each fixture makes its own `mkdtemp` under
      # TMPDIR and hands it to its children, so two concurrent files never share
      # an artifact tree, and nothing can fall back to a directory nobody made.
      TMPDIR: /tmp
      PGHOST: db
      PGPORT: "5432"
      # The maintenance database: where `CREATE DATABASE` is issued from,
      # serialised by a session advisory lock. No test data lives in it.
      PGDATABASE: postgres
      # The cluster's superuser: the rig creates and drops its databases, and some
      # fixtures write what the application never could (session_replication_role).
      PGUSER: postgres
      # The project's own secret, mounted read-only below; never an environment variable.
      PGPASSWORD_FILE: /run/secrets/pg_superuser_password
      # Prefix of every test database this run creates (`qwbe_t_<run>_…`).
      QWBE_TEST_RUN: ${QWBE_TEST_RUN:?run through scripts/verify-docker.sh}
      # Passed through only when set, for the CLI children the suite spawns; the
      # in-process fixtures choose their plugins themselves. Unset: every plugin.
      QWBE_PLUGINS:
    secrets:
      - pg_superuser_password
    depends_on:
      test-init:
        condition: service_completed_successfully
    networks:
      - project
    volumes: *test-volumes
    tmpfs:
      - /tmp:size=2g,mode=1777,uid=${HOST_UID},gid=${HOST_GID}
    init: true
    restart: "no"
    command: ["pnpm test"]

secrets:
  pg_superuser_password:
    file: ${QWBE_PG_SUPERUSER_PASSWORD_FILE:?run through scripts/verify-docker.sh}

networks:
  # The default network of the `qwbe-invoicing` project (compose.yaml), where `db` answers.
  project:
    external: true
    name: qwbe-invoicing_default

volumes:
  # Produced by the `qwbe-invoicing-verify` compose project: one dependency tree
  # for both rigs, so a test run never installs a second copy.
  verify-node-modules:
    external: true
    name: qwbe-invoicing-verify_verify-node-modules
  verify-frontend-node-modules:
    external: true
    name: qwbe-invoicing-verify_verify-frontend-node-modules
  verify-pnpm-store:
    external: true
    name: qwbe-invoicing-verify_verify-pnpm-store
  verify-home:
    external: true
    name: qwbe-invoicing-verify_verify-home
