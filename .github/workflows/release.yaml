name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # `pnpm verify` needs a PostgreSQL 16 cluster, so it runs in the repository's own
  # Docker harness (compose.verify.yaml): the pinned Node/pnpm image plus a throwaway
  # cluster on tmpfs, exactly as on a developer machine. No host runtime is used.
  verify:
    runs-on: ubuntu-24.04
    # The harness pushes nothing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-docker.sh build
      - run: scripts/verify-docker.sh install
      - run: scripts/verify-docker.sh verify
      - if: always()
        run: scripts/verify-docker.sh down

  build:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      # One image: the kernel, serving the UI built in its `ui-builder` stage.
      - uses: docker/build-push-action@v6
        id: build-app
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Write image digests
        run: |
          echo "${{ steps.meta.outputs.version }}" > image-digests.txt
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-app.outputs.digest }}" >> image-digests.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.txt
