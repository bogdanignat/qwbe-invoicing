# Explicitly opt-in. This file never references the existing Warden/data volume.
# The shipped image, built from this checkout, on its own fixture stack, at
# http://invoicing-preview.localhost:3181 (loopback only).
#
# Its own project name, its own PostgreSQL cluster, its own secrets and its own
# volumes: nothing here can reach the development stack's cluster or its data, and
# nothing in the development stack can reach this one. The preview secrets have no
# default on purpose — a fixture that boots with a guessable password is a fixture
# that gets reused where it should not be.
#
# The three database roles of the shipped stacks (deploy/postgres/grants.sql): `postgres`,
# the superuser, only for `db-init`; qwbe_owner, the schema owner, for `migrate`; qwbe_app,
# DML only, for `app`. A preview cluster created with the old `qwbe_preview` superuser is
# not converted: `docker compose -f compose.preview.yaml --profile preview down -v` first.
#
#   install -d -m 700 .local && umask 077
#   for name in api-token pg-superuser-password pg-owner-password pg-app-password company-lookup-key; do
#     openssl rand -hex 32 > ".local/preview-$name"
#   done
#   PREVIEW_AUTH_TOKEN_PATH=./.local/preview-api-token \
#   PREVIEW_PG_SUPERUSER_PASSWORD_PATH=./.local/preview-pg-superuser-password \
#   PREVIEW_PG_OWNER_PASSWORD_PATH=./.local/preview-pg-owner-password \
#   PREVIEW_PG_APP_PASSWORD_PATH=./.local/preview-pg-app-password \
#   PREVIEW_COMPANY_LOOKUP_KEY_PATH=./.local/preview-company-lookup-key \
#     docker compose -f compose.preview.yaml --profile preview up -d
# To change the port, set PREVIEW_PORT and PREVIEW_ORIGIN together: the kernel pins
# Host and Origin to PREVIEW_ORIGIN.
name: qwbe-invoicing-preview

x-postgres-environment: &postgres-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: qwbe_preview

services:
  db:
    profiles: [preview]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: qwbe_preview
      # The cluster's superuser, for db-init only: never migrate or app.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      # The same C collation as the shipped cluster: a preview that pages rows in a
      # different order than production is not a preview of production.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [pg_superuser_password]
    volumes:
      - preview-postgres:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d qwbe_preview"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  # deploy/postgres/db-init.sh, as in compose.yaml: grants.sql and the two role passwords,
  # as the superuser, before every `migrate`. Root, because only root reads the 0600
  # secret files here.
  db-init:
    profiles: [preview]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "0:0"
    command: [sh, /qwbe-postgres/db-init.sh]
    environment:
      PGHOST: db
      PGDATABASE: qwbe_preview
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    volumes:
      - ./deploy/postgres:/qwbe-postgres:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    restart: "no"

  migrate:
    profiles: [preview]
    image: qwbe-invoicing:preview
    build:
      context: .
      dockerfile: Dockerfile
    command: [node, bin/qwbe-invoicing.ts, migrate, --apply, --json]
    environment:
      <<: *postgres-environment
      PGUSER: qwbe_owner
      PGPASSWORD_FILE: /run/secrets/pg_owner_password
      NODE_ENV: development
      DATA_DIR: /data
    secrets: [pg_owner_password]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - preview-data:/data
    read_only: true
    tmpfs: [/tmp]
    restart: "no"

  app:
    profiles: [preview]
    image: qwbe-invoicing:preview
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *postgres-environment
      PGUSER: qwbe_app
      PGPASSWORD_FILE: /run/secrets/pg_app_password
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ORGANIZATION_ID: preview-fixture-only
      AUTH_TOKEN_FILE: /run/secrets/preview_api_token
      COMPANY_LOOKUP_KEY_FILE: /run/secrets/preview_company_lookup_key
      # Optional plugins, comma-separated (`payments`, `efactura`, `company-lookup`). Passed through
      # only when set: unset means every plugin runs, empty means none. Restart to apply.
      QWBE_PLUGINS:
      # The origin the browser uses for the published port below.
      PUBLIC_ORIGIN: ${PREVIEW_ORIGIN:-http://invoicing-preview.localhost:3181}
      TMPDIR: /var/backups/staging
    secrets: [preview_api_token, pg_app_password, preview_company_lookup_key]
    volumes:
      - preview-data:/data
      - preview-backup-staging:/var/backups/staging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Loopback only: the preview is for this machine's browser, never the network.
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-3181}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    init: true
    stop_grace_period: 15s
    restart: "no"

secrets:
  preview_api_token:
    file: ${PREVIEW_AUTH_TOKEN_PATH:?Set a separate synthetic preview token file}
  # The shipped secret names, so deploy/postgres/db-init.sh reads them where it does in
  # compose.yaml; the files are the preview's own.
  pg_superuser_password:
    file: ${PREVIEW_PG_SUPERUSER_PASSWORD_PATH:?Set a separate synthetic preview PostgreSQL superuser password file}
  pg_owner_password:
    file: ${PREVIEW_PG_OWNER_PASSWORD_PATH:?Set a separate synthetic preview qwbe_owner password file}
  pg_app_password:
    file: ${PREVIEW_PG_APP_PASSWORD_PATH:?Set a separate synthetic preview qwbe_app password file}
  preview_company_lookup_key:
    file: ${PREVIEW_COMPANY_LOOKUP_KEY_PATH:?Set a separate synthetic preview company lookup master key file}

volumes:
  # Anonymous, project-scoped and distinct from every shipped volume name: the
  # preview cluster and its artifacts are thrown away with the project.
  preview-data: {}
  preview-postgres: {}
  preview-backup-staging: {}
