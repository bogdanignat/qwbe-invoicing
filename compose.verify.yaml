# Verification harness only. It publishes no port, touches no application volume
# and never runs the shipped image: it binds the working tree and runs the pinned
# Node/pnpm pair so lint, typecheck, tests, gates and probes need no host runtime.
# Entry point: scripts/verify-docker.sh (it exports HOST_UID/HOST_GID, the run id
# and the password path, and starts the project's `db` when it is down).
#
# No PostgreSQL of its own: the suite runs on the project's cluster (`db` of
# compose.yaml, over its network), in throwaway databases named `qwbe_t_<run>_…`
# that the rig creates from `postgres` and drops again; `qwbe_invoicing` is never
# used. Use `compose.test.yaml` for the fast test-only loop; this file exists so
# the whole gate runs in one command.
name: qwbe-invoicing-verify

x-verify-image: &verify-image
  image: qwbe-invoicing-verify:${VERIFY_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile.verify
    args:
      HOST_UID: ${HOST_UID:?run through scripts/verify-docker.sh}
      HOST_GID: ${HOST_GID:?run through scripts/verify-docker.sh}

x-verify-volumes: &verify-volumes
  - .:/app
  - verify-node-modules:/app/node_modules
  - verify-frontend-node-modules:/app/frontend/node_modules
  - verify-pnpm-store:/pnpm-store
  - verify-home:/home/verifier

services:
  # A fresh named volume is created root-owned; the verifier runs as the host user,
  # so ownership is handed over once, before anything else runs. Idempotent.
  verify-init:
    <<: *verify-image
    user: "0:0"
    command:
      - |
        set -eu
        chown ${HOST_UID}:${HOST_GID} /app/node_modules /app/frontend/node_modules /pnpm-store /pnpm-store/store /home/verifier
    volumes: *verify-volumes
    restart: "no"

  # Dependencies only: no database, so not on the project's network, which may not
  # exist yet (a fresh checkout, CI before the first `verify`).
  install:
    <<: *verify-image
    user: "${HOST_UID}:${HOST_GID}"
    depends_on:
      verify-init:
        condition: service_completed_successfully
    volumes: *verify-volumes
    init: true
    restart: "no"

  verify:
    <<: *verify-image
    user: "${HOST_UID}:${HOST_GID}"
    # The run id the script reclaims by: a test database whose run has no live
    # container left is a leftover (scripts/verify-docker.sh).
    labels:
      qwbe.test-run: ${QWBE_TEST_RUN:?run through scripts/verify-docker.sh}
    environment:
      # NODE_ENV is deliberately not set: every caller that cares (CLI guards,
      # tests) sets it itself. PUBLIC_ORIGIN is deliberately not set either: the
      # fixtures listen on ephemeral loopback ports and pin that address, and a CLI
      # child inherits this environment, so one fixed origin here would refuse them.
      # Scratch only: tmpfs below, nothing in it survives the container. No
      # DATA_DIR: the fixtures make their own under TMPDIR.
      TMPDIR: /tmp
      PGHOST: db
      PGPORT: "5432"
      # The maintenance database: where `CREATE DATABASE` is issued from,
      # serialised by a session advisory lock. No test data lives in it.
      PGDATABASE: postgres
      PGUSER: qwbe
      # The project's own secret, mounted read-only below; never an environment variable.
      PGPASSWORD_FILE: /run/secrets/pg_password
      # Prefix of every test database this run creates (`qwbe_t_<run>_…`).
      QWBE_TEST_RUN: ${QWBE_TEST_RUN:?run through scripts/verify-docker.sh}
      # Passed through only when set, for the CLI children the suite spawns; the
      # in-process fixtures choose their plugins themselves. Unset: every plugin.
      QWBE_PLUGINS:
    secrets:
      - pg_password
    depends_on:
      verify-init:
        condition: service_completed_successfully
    networks:
      - project
    volumes: *verify-volumes
    tmpfs:
      - /tmp:size=2g,mode=1777,uid=${HOST_UID},gid=${HOST_GID}
    init: true
    restart: "no"

secrets:
  pg_password:
    file: ${QWBE_PG_PASSWORD_FILE:?run through scripts/verify-docker.sh}

networks:
  # The default network of the `qwbe-invoicing` project (compose.yaml), where `db` answers.
  project:
    external: true
    name: qwbe-invoicing_default

volumes:
  verify-node-modules: {}
  verify-frontend-node-modules: {}
  verify-pnpm-store: {}
  verify-home: {}
