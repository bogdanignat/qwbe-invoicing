name: qwbe-invoicing

# Production / self-host bundle: `docker compose -f compose.prod.yaml up -d`, with the
# values in `.env` next to it (see .env.example and the README "Quick start (self-host)").
# No Warden, no Traefik labels and no published port by default. One image: `app` serves
# the UI and `/api` on PUBLIC_ORIGIN; `migrate` runs the same image once before it.
#
# TLS, one of:
#   - the bundled Caddy:  docker compose -f compose.prod.yaml --profile proxy up -d
#     (publishes 80/443; copy Caddyfile.example to Caddyfile first)
#   - a reverse proxy already on this host (nginx, Caddy, Traefik):
#     docker compose -f compose.prod.yaml -f compose.loopback.yaml up -d
#     (publishes `app` on 127.0.0.1:${APP_LOOPBACK_PORT} only)
#
# Either proxy reaches `app` from inside the project network, whose subnets are fixed
# below: the bundled Caddy has addresses in them, and a proxy on the host comes in
# through the gateway. QWBE_TRUSTED_PROXY defaults to both subnets, so the login throttle
# keys on the client each proxy writes in X-Forwarded-For, not on the proxy.
#
# Before the first `up`, create the four secret files (`scripts/init-secrets.sh` does it,
# from the paths in .env); this file mounts three, compose.anaf.yaml the ANAF token key.
# They are never in this file, never in the image and never in an environment variable.
# The company-lookup key encrypts the openapi.ro key at rest;
# it is never rotated in place: a new one makes the stored openapi.ro key unreadable
# until it is entered again. Every path, the image tag and PUBLIC_ORIGIN are required
# (`:?`) rather than defaulted: a stack that starts with a guessable fallback credential
# or the wrong origin is worse than one that refuses to start.

x-postgres-environment: &postgres-environment
  PGHOST: db
  PGPORT: "5432"
  # The database app and migrate use: qwbe_invoicing at install, a new one after
  # scripts/production/restore.sh, which switches it together with QWBE_DATA_VOLUME.
  # POSTGRES_DB below only names the database the cluster is created with.
  PGDATABASE: ${QWBE_PGDATABASE:?Set QWBE_PGDATABASE to the active database, qwbe_invoicing at install}
  PGUSER: qwbe
  # The application reads the password from this file, never from PGPASSWORD: an
  # environment variable travels into every child process and into `docker inspect`.
  # Outside development `kernel/config.ts` refuses to boot when the file is
  # missing or empty, so this is fail-closed rather than best effort.
  PGPASSWORD_FILE: /run/secrets/pg_password

# No capability and no privilege gained on exec, unless a service adds back what it needs.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    <<: *hardening
    # The entrypoint starts as root: it owns PGDATA and the socket directory to
    # `postgres` (CHOWN, FOWNER, DAC_OVERRIDE), then drops to that user (SETUID, SETGID).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: qwbe_invoicing
      POSTGRES_USER: qwbe
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      # C collation for the whole cluster. The schema's indexes, keyset cursors and
      # the folded case-insensitive expressions were all written against binary text
      # ordering; any other collation silently changes paging order.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - pg_password
    volumes:
      - invoicing-postgres:/var/lib/postgresql/data
    # Not published. Only the application network reaches the database.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qwbe -d qwbe_invoicing"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: ${QWBE_IMAGE:-ghcr.io/bogdanignat/qwbe-invoicing}:${IMAGE_TAG:?Set IMAGE_TAG, e.g. local for your own build or 0.3.0@sha256:<digest> for a release}
    <<: *hardening
    command: ["node", "bin/qwbe-invoicing.ts", "migrate", "--apply", "--confirm-production", "--json"]
    environment:
      <<: *postgres-environment
      NODE_ENV: production
      DATA_DIR: /data
    secrets:
      - pg_password
    # Without this the migration runs against a server that is not accepting
    # connections yet and `app` comes up on an empty schema. There is no fallback
    # path in which `migrate` runs without the database or without the secret.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - invoicing-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  app:
    image: ${QWBE_IMAGE:-ghcr.io/bogdanignat/qwbe-invoicing}:${IMAGE_TAG:?Set IMAGE_TAG, e.g. local for your own build or 0.3.0@sha256:<digest> for a release}
    <<: *hardening
    environment:
      <<: *postgres-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ORGANIZATION_ID: ${ORGANIZATION_ID:-local-organization}
      AUTH_TOKEN_FILE: /run/secrets/api_token
      # The master key that encrypts the openapi.ro key at rest (company-lookup).
      COMPANY_LOOKUP_KEY_FILE: /run/secrets/company_lookup_key
      # Optional plugins, comma-separated (`payments`, `efactura`, `company-lookup`). Passed through
      # only when set: unset means every plugin runs, empty means none. Restart to apply.
      QWBE_PLUGINS:
      # The ANAF e-Factura environment: `test` unless `prod` is written out in .env. The
      # OAuth client and its secrets come only with compose.anaf.yaml (docs/LOCAL_DEVELOPMENT.md).
      ANAF_ENVIRONMENT: ${ANAF_ENVIRONMENT:-test}
      # Required to serve in production: the kernel pins Host, X-Forwarded-Host/-Proto
      # and Origin to it. Scheme and host exactly as the browser sees them, no path.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public https origin, e.g. https://invoice.example.com}
      # Off by default: any Authorization header is refused. `on` serves the Bearer API
      # on this same listener; see the README before switching it on.
      QWBE_BEARER_API: ${QWBE_BEARER_API:-off}
      # Whose X-Forwarded-For keys the login throttle (README, Configuration): the project
      # network by default, i.e. the bundled Caddy or a proxy on the host. Empty in .env
      # trusts nobody, and every client behind the proxy then shares the proxy's bucket.
      QWBE_TRUSTED_PROXY: ${QWBE_TRUSTED_PROXY-${QWBE_NETWORK_SUBNET:-10.93.0.0/24},${QWBE_NETWORK_SUBNET_IPV6:-fd93:1c5e:a7b0::/64}}
      # The Vite build the kernel serves; the image sets the same value. Required in
      # production: `serve` refuses to start without an index.html there.
      QWBE_UI_DIR: /app/frontend/dist
      # `backup` and `restore` stage into a `mkdtemp` under TMPDIR and the archive
      # bounds allow 1 GiB expanded, so staging is a disk volume and not the small
      # tmpfs below: a 1 GiB staging tree in `/tmp` would be 1 GiB of RAM.
      TMPDIR: /var/backups/staging
    secrets:
      - api_token
      - pg_password
      - company_lookup_key
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - invoicing-data:/data
      - invoicing-backup-staging:/var/backups/staging
    expose:
      - "3000"
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    read_only: true
    tmpfs:
      # Bounded on purpose: with TMPDIR pointed at the staging volume nothing large
      # lands here, and an unbounded tmpfs is a way to consume the host's memory.
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    # Pinned like the database: a new Caddy is a reviewed edit of this line, not a pull.
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    profiles: ["proxy"]
    <<: *hardening
    # Root inside the container, to bind 80 and 443; nothing else. The Caddyfile must
    # be world-readable (a plain `cp` is): without DAC_OVERRIDE root cannot read a 0600 file.
    cap_add: [NET_BIND_SERVICE]
    # `app` is healthy only once it holds the SHARED maintenance barrier and the
    # schema matches the ledger, so Caddy deliberately does not come up in front of
    # an application that would answer 503 to every `/api` request.
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

# The project network, on fixed subnets so QWBE_TRUSTED_PROXY can name them. IPv4 outside
# Docker's default pools (172.17-31.x, 192.168.x), IPv6 a ULA; change one in .env if it
# overlaps a network of this host, and QWBE_TRUSTED_PROXY follows unless set on its own.
# IPv6 is on so that Docker (27+, ip6tables) forwards Caddy's IPv6 visitors to its own
# IPv6 address with their real source, instead of through docker-proxy from the gateway.
# A host without IPv6 adds compose.ipv4-only.yaml, which drops the IPv6 subnet.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${QWBE_NETWORK_SUBNET:-10.93.0.0/24}
        - subnet: ${QWBE_NETWORK_SUBNET_IPV6:-fd93:1c5e:a7b0::/64}

secrets:
  api_token:
    file: ${AUTH_TOKEN_PATH:?Set AUTH_TOKEN_PATH to the operator-created API token file}
  pg_password:
    file: ${PG_PASSWORD_PATH:?Set PG_PASSWORD_PATH to the operator-created PostgreSQL password file}
  company_lookup_key:
    file: ${COMPANY_LOOKUP_KEY_PATH:?Set COMPANY_LOOKUP_KEY_PATH to the operator-created company lookup master key file}

volumes:
  # The artifact volume: qwbe-invoicing-data at install, a new one after a restore.
  invoicing-data:
    name: ${QWBE_DATA_VOLUME:?Set QWBE_DATA_VOLUME to the active artifact volume, qwbe-invoicing-data at install}
  # The cluster volume, named separately and created fresh at first start. Nothing
  # here reuses or resets an older volume.
  invoicing-postgres:
    name: qwbe-invoicing-postgres
  # Backup/restore staging. Separate from the data volume so a staging tree that
  # fills up cannot take the artifact store with it.
  invoicing-backup-staging:
    name: qwbe-invoicing-backup-staging
  # Prefixed, so a Caddy of another stack on the same host keeps its own certificates.
  caddy-data:
    name: qwbe-invoicing-caddy-data
  caddy-config:
    name: qwbe-invoicing-caddy-config
