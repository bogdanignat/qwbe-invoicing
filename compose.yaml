name: qwbe-invoicing

x-postgres-environment: &postgres-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: qwbe_invoicing
  PGUSER: qwbe
  # The password is read from this file by the application, never from PGPASSWORD:
  # an environment variable would travel into every child process and into
  # `docker inspect`.
  PGPASSWORD_FILE: /run/secrets/pg_password

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: qwbe_invoicing
      POSTGRES_USER: qwbe
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      # C collation, for the whole cluster: the SQLite baseline ordered text
      # binary and only C reproduces that, so every index and keyset agrees.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - pg_password
    volumes:
      - invoicing-postgres:/var/lib/postgresql/data
    # Not published: only the application network reaches the database.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U qwbe -d qwbe_invoicing"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: qwbe-invoicing:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "bin/qwbe-invoicing.ts", "migrate", "--apply", "--json"]
    environment:
      <<: *postgres-environment
      NODE_ENV: development
      DATA_DIR: /data
    secrets:
      - pg_password
    # Without this the migration would run against a server that is not up yet
    # and `app` would start on an empty schema.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - invoicing-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  app:
    image: qwbe-invoicing:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *postgres-environment
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ORGANIZATION_ID: ${ORGANIZATION_ID:-local-organization}
      AUTH_TOKEN_FILE: /run/secrets/api_token
      # `backup` and `restore` stage into a `mkdtemp` under TMPDIR, and the archive
      # bounds allow 1 GiB expanded: staging is a disk volume, not the small tmpfs
      # below, because a 1 GiB staging tree in `/tmp` would be 1 GiB of RAM.
      TMPDIR: /var/backups/staging
    secrets:
      - api_token
      - pg_password
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - invoicing-data:/data
      - invoicing-backup-staging:/var/backups/staging
    # Internal since T-1649: only the Compose network reaches the backend. The browser
    # and API callers go through the Next BFF at https://invoice.test/api/qwbe/<path>.
    expose:
      - "3000"
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    read_only: true
    tmpfs:
      # Bounded: with TMPDIR on the staging volume nothing large lands here, and an
      # unbounded tmpfs is a way to consume the host's memory.
      - /tmp:size=64m

  # The Next application (frontend/) owns https://invoice.test. Its healthcheck on
  # /healthz comes from frontend/Dockerfile.
  frontend:
    image: qwbe-invoicing-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FRONTEND_ORIGIN: https://${APP_DOMAIN:-invoice.test}
      INVOICING_API_URL: http://app:3000
    # No depends_on app: the UI must still boot and report an unavailable upstream.
    networks:
      - default
      - warden
    labels:
      traefik.enable: "true"
      traefik.docker.network: warden
      traefik.http.routers.qwbe-invoicing.rule: Host(`${APP_DOMAIN:-invoice.test}`)
      traefik.http.routers.qwbe-invoicing.entrypoints: https
      traefik.http.routers.qwbe-invoicing.tls: "true"
      traefik.http.services.qwbe-invoicing.loadbalancer.server.port: "3000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # Bounded like the backend's /tmp; uid 1000 is `node` in the image.
      - /tmp:size=64m
      - /app/frontend/.next/cache:uid=1000,gid=1000,size=64m

secrets:
  api_token:
    file: ${AUTH_TOKEN_PATH:-./.local/api-token}
  pg_password:
    file: ${PG_PASSWORD_PATH:-./.local/pg-password}

networks:
  warden:
    external: true
    name: warden

volumes:
  invoicing-data:
    name: ${DATA_VOLUME_NAME:-qwbe-invoicing-data}
  # A fresh volume, named separately: no old cluster is reused or reset.
  invoicing-postgres:
    name: ${PG_VOLUME_NAME:-qwbe-invoicing-postgres}
  # Backup/restore staging, separate from the data volume so a staging tree that
  # fills up cannot take the artifact store with it.
  invoicing-backup-staging:
    name: ${BACKUP_STAGING_VOLUME_NAME:-qwbe-invoicing-backup-staging}
