name: qwbe-invoicing

x-postgres-environment: &postgres-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: qwbe_invoicing

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: qwbe_invoicing
      # The cluster's superuser, for db-init, restore and the test rig only: `migrate`
      # connects as qwbe_owner and `app` as qwbe_app (deploy/postgres/grants.sql).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      # C collation, for the whole cluster: the SQLite baseline ordered text
      # binary and only C reproduces that, so every index and keyset agrees.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    # The test suite (scripts/verify-docker.sh) runs on this cluster too: ~40
    # connections per run at the peak, and two worktrees may run at once next to
    # the application. The default 100 would leave almost no headroom.
    command: ["postgres", "-c", "max_connections=200"]
    # The superuser's only: db-init sets the two role passwords.
    secrets:
      - pg_superuser_password
    volumes:
      - invoicing-postgres:/var/lib/postgresql/data
    # Not published: only the application network reaches the database.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d qwbe_invoicing"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # The roles and grants of deploy/postgres/grants.sql and the two login passwords, as
  # the superuser, before every `migrate`. Root, because only root reads the 0600
  # secret files here; the image's initdb scripts run as `postgres` and cannot.
  db-init:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "0:0"
    command: ["sh", "/qwbe-postgres/db-init.sh"]
    environment:
      PGHOST: db
      PGDATABASE: qwbe_invoicing
    secrets:
      - pg_superuser_password
      - pg_owner_password
      - pg_app_password
    volumes:
      - ./deploy/postgres:/qwbe-postgres:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    image: qwbe-invoicing:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "bin/qwbe-invoicing.ts", "migrate", "--apply", "--json"]
    environment:
      <<: *postgres-environment
      # The schema owner, not a superuser. The password is read from this file by the
      # application, never from PGPASSWORD: an environment variable would travel into
      # every child process and into `docker inspect`.
      PGUSER: qwbe_owner
      PGPASSWORD_FILE: /run/secrets/pg_owner_password
      NODE_ENV: development
      DATA_DIR: /data
    secrets:
      - pg_owner_password
    # Without this the migration would run against a server that is not up yet, or
    # before its role exists, and `app` would start on an empty schema.
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - invoicing-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  app:
    image: qwbe-invoicing:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *postgres-environment
      # DML only: no DDL in `public`, no trigger switch (deploy/postgres/grants.sql).
      PGUSER: qwbe_app
      PGPASSWORD_FILE: /run/secrets/pg_app_password
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ORGANIZATION_ID: ${ORGANIZATION_ID:-local-organization}
      AUTH_TOKEN_FILE: /run/secrets/api_token
      # The master key that encrypts the openapi.ro key at rest (company-lookup).
      COMPANY_LOOKUP_KEY_FILE: /run/secrets/company_lookup_key
      # Optional plugins, comma-separated (`payments`, `efactura`, `company-lookup`). Passed through
      # only when set: unset means every plugin runs, empty means none. Restart to apply.
      QWBE_PLUGINS:
      # The ANAF e-Factura environment: `test` unless `prod` is written out in .env. The
      # OAuth client and its secrets come only with compose.anaf.yaml (docs/LOCAL_DEVELOPMENT.md).
      ANAF_ENVIRONMENT: ${ANAF_ENVIRONMENT:-test}
      # The one origin the browser reaches: the kernel pins Host, X-Forwarded-* and
      # Origin to it, and serves the UI (QWBE_UI_DIR, set in the image) and /api on it.
      PUBLIC_ORIGIN: https://${APP_DOMAIN:-invoice.test}
      # Off by default; `QWBE_BEARER_API=on` in .env serves the Bearer API on the same origin.
      QWBE_BEARER_API: ${QWBE_BEARER_API:-off}
      # Unset trusts no proxy's X-Forwarded-For (README, Configuration). Passed through only when set.
      QWBE_TRUSTED_PROXY:
      # `backup` and `restore` stage into a `mkdtemp` under TMPDIR, and the archive
      # bounds allow 1 GiB expanded: staging is a disk volume, not the small tmpfs
      # below, because a 1 GiB staging tree in `/tmp` would be 1 GiB of RAM.
      TMPDIR: /var/backups/staging
    secrets:
      - api_token
      - pg_app_password
      - company_lookup_key
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - invoicing-data:/data
      - invoicing-backup-staging:/var/backups/staging
    # No published port: Warden's Traefik terminates TLS for https://invoice.test and
    # reaches the kernel over the external `warden` network. This network and these
    # labels exist only in the local development stack; compose.prod.yaml has neither.
    expose:
      - "3000"
    networks:
      - default
      - warden
    labels:
      traefik.enable: "true"
      traefik.docker.network: warden
      traefik.http.routers.qwbe-invoicing.rule: Host(`${APP_DOMAIN:-invoice.test}`)
      traefik.http.routers.qwbe-invoicing.entrypoints: https
      traefik.http.routers.qwbe-invoicing.tls: "true"
      traefik.http.services.qwbe-invoicing.loadbalancer.server.port: "3000"
    restart: unless-stopped
    stop_grace_period: 15s
    init: true
    read_only: true
    tmpfs:
      # Bounded: with TMPDIR on the staging volume nothing large lands here, and an
      # unbounded tmpfs is a way to consume the host's memory.
      - /tmp:size=64m

secrets:
  api_token:
    file: ${AUTH_TOKEN_PATH:-./.local/api-token}
  pg_superuser_password:
    file: ${PG_SUPERUSER_PASSWORD_PATH:-./.local/pg-superuser-password}
  pg_owner_password:
    file: ${PG_OWNER_PASSWORD_PATH:-./.local/pg-owner-password}
  pg_app_password:
    file: ${PG_APP_PASSWORD_PATH:-./.local/pg-app-password}
  company_lookup_key:
    file: ${COMPANY_LOOKUP_KEY_PATH:-./.local/company-lookup-key}

networks:
  warden:
    external: true
    name: warden

volumes:
  invoicing-data:
    name: ${DATA_VOLUME_NAME:-qwbe-invoicing-data}
  # A fresh volume, named separately: no old cluster is reused or reset.
  invoicing-postgres:
    name: ${PG_VOLUME_NAME:-qwbe-invoicing-postgres}
  # Backup/restore staging, separate from the data volume so a staging tree that
  # fills up cannot take the artifact store with it.
  invoicing-backup-staging:
    name: ${BACKUP_STAGING_VOLUME_NAME:-qwbe-invoicing-backup-staging}
