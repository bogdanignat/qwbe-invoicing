# Throwaway PostgreSQL 16 rig for T-1480 step 0b(g): the `pg` driver API.
#
# Nothing here ships and nothing here persists: the cluster lives on tmpfs, no
# port is published, no existing volume of the application is referenced and the
# project name is its own. `trust` authentication exists only inside this rig and
# is never copied into the runtime stack (plan step 1 uses POSTGRES_PASSWORD_FILE).
#
# The probe needs the installed driver, so it mounts the verifier project's
# dependency volume read-only. It is never written to here; it is produced by
# `scripts/verify-docker.sh install`.
#
# Run: docker compose --file compose.pg-driver-probe.yaml run --rm driver-probe
# Down: docker compose --file compose.pg-driver-probe.yaml down   (no volume, no -v)
name: qwbe-invoicing-pg-driver-probe

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: probe
      POSTGRES_USER: probe
      POSTGRES_HOST_AUTH_METHOD: trust
      # locale C, like the plan's target cluster. No check here depends on
      # collation, and no collation conclusion may be drawn from these logs.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data:size=512m,uid=70,gid=70
      - /tmp
      - /run/postgresql:uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U probe -d probe"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  driver-probe:
    # The image the application is built from, so the driver is exercised on the
    # real base layer and not on a convenience image.
    image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: probe
      PGUSER: probe
    volumes:
      # Minimal surface on purpose: the probe and the manifest that makes it an
      # ES module, nothing else of the tree (no .env, no sources, no fixtures).
      - ./probes/pg-driver-probe.mjs:/app/probes/pg-driver-probe.mjs:ro
      - ./package.json:/app/package.json:ro
      - verify-node-modules:/app/node_modules:ro
    tmpfs:
      - /tmp
    working_dir: /app
    entrypoint: ["node", "/app/probes/pg-driver-probe.mjs"]
    init: true
    restart: "no"

volumes:
  # Produced by the `qwbe-invoicing-verify` compose project; read-only here.
  verify-node-modules:
    external: true
    name: qwbe-invoicing-verify_verify-node-modules
